<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cifrador de Carpetas - Argon2id + AES-256-GCM</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 10px; margin-bottom: 24px; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; }
        input[type="file"], input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #0369a1; }
        .btn-secondary { background: #475569; margin-bottom: 12px; }
        .alert { padding: 12px; background: #991b1b; border-radius: 6px; margin-bottom: 16px; }
        .row { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>
    <h1>Bóveda de Carpetas</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
        <h2>1. Cifrar Carpeta Completa</h2>
        <form action="/encrypt" method="POST" enctype="multipart/form-data">
            <label>Selecciona una carpeta (cualquier tipo de archivo):</label>
            <input type="file" name="folder_files" webkitdirectory directory multiple required>

            <label>Contraseña de cifrado:</label>
            <div class="row">
                <input type="text" id="enc-pass" name="password" placeholder="Escribe o genera una contraseña" required>
                <button type="button" class="btn-secondary" onclick="suggestPassword()">Sugerir</button>
            </div>

            <button type="submit">Cifrar y Descargar (.vault)</button>
        </form>
    </div>

    <div class="card">
        <h2>2. Descifrar Archivo (.vault)</h2>
        <form action="/decrypt" method="POST" enctype="multipart/form-data">
            <label>Selecciona el archivo .vault:</label>
            <input type="file" name="vault_file" accept=".vault" required>

            <label>Contraseña:</label>
            <input type="password" name="password" placeholder="Contraseña usada al cifrar" required>

            <button type="submit">Descifrar y Extraer (.zip)</button>
        </form>
    </div>

    <script>
        async function suggestPassword() {
            const res = await fetch('/generate-password?length=20');
            const data = await res.json();
            document.getElementById('enc-pass').value = data.password;
        }
    </script>
</body>
</html>
